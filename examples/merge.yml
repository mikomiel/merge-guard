# .github/workflows/merge-guard-merge.yml — runs whenever the gate publishes.
name: merge-guard merge

on:
  workflow_run:
    workflows: ["CI", "merge-guard review"]
    types: [completed]
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: merge-guard-merge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: mikomiel/merge-guard@0000000000000000000000000000000000000000  # pin the release SHA
        with:
          mode: merge
          token: ${{ github.token }}
