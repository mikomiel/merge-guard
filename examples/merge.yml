# Replace before use: the merge-guard ref with the release SHA.
# .github/workflows/merge-guard-merge.yml — runs whenever the gate publishes.
#
# The review workflow is the only prerequisite trigger. It is itself triggered
# by CI and by the review relay, so both paths still reach a merge attempt
# without evaluating a head twice (issue #23).
name: merge-guard merge

on:
  workflow_run:
    workflows: ["merge-guard review"]
    types: [completed]
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  pull-requests: write
  # GitHub closes linked issues only for a merge performed with `issues: write`.
  issues: write
  checks: read
  statuses: read

concurrency:
  group: merge-guard-merge
  cancel-in-progress: false

jobs:
  merge:
    outputs:
      merged: ${{ steps.gate.outputs.merged }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - id: gate
        uses: mikomiel/merge-guard@0000000000000000000000000000000000000000  # pin the release SHA
        with:
          mode: merge
          token: ${{ github.token }}

  # Optional: run the release workflow only when this merge run landed something.
  release:
    needs: merge
    if: needs.merge.outputs.merged == 'true'
    uses: ./.github/workflows/release-please.yml
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
