# Copy to .github/merge-guard.toml in the consumer repository and replace every
# placeholder. This file is itself a sensitive path: changing it needs a human
# merge.

[repository]
name = "OWNER/REPO"
base_branch = "main"

[review]
# The reviewer identity the gate trusts. The numeric id is required: a login
# can be renamed, an id cannot. Native reviewDecision is never an input.
reviewer_id = 0
reviewer_login = "REVIEWER[bot]"
reviewer_type = "Bot"
required_checks = ["CHECKS"]
gate_context = "review"
review_workflow = "merge-guard-review.yml"
merge_workflow = "merge-guard-merge.yml"

[paths]
# An allowlist. Anything not matched is human-only.
ordinary = [
  "README.md",
  "CHANGELOG.md",
  "docs/**",
]
# Off by default: even a root-manifest bump is a human decision unless the
# repository opts in.
dependency_update_exemption = false
