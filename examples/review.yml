# .github/workflows/merge-guard-review.yml — publishes the `review` status.
name: merge-guard review

on:
  workflow_run:
    workflows: ["review relay"]
    types: [completed]
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read
  checks: read
  statuses: write

jobs:
  review:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
      - uses: mikomiel/merge-guard@0000000000000000000000000000000000000000  # pin the release SHA
        with:
          mode: review
          token: ${{ github.token }}
