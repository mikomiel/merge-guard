# Release automation under the repository's own merge policy: release-please
# opens one release pull request on a release-relevant conventional commit, and
# merging that pull request is the maintainer's release decision. The release
# pull request always changes a path outside the ordinary allowlist
# (pyproject.toml, merge_guard/__init__.py, this configuration or the
# manifest), so the gate never merges it.
#
# The merge workflow calls this one when its own run landed a pull request, so a
# sweep or a review pass that merges nothing costs no release run. `push` keeps
# the path for a merge performed with a token that does create push events, and
# `workflow_dispatch` is the manual reconciliation path. `workflow_run` is not a
# trigger here: it fires on every completion of the merge workflow, whether or
# not that run merged anything.
#
# The token is a fine-grained personal access token with Contents: write and
# Pull requests: write on this repository, stored as RELEASE_PLEASE_TOKEN. The
# default GITHUB_TOKEN cannot be used: a pull request it creates does not
# trigger the pull-request workflows, so the required checks would never run.
# A push made with GITHUB_TOKEN has the same defect: it starts no pull-request
# workflow, so `checks` would never run on the new head and the pull request
# could not merge. The push of the regenerated manifest therefore uses the
# personal access token too.
#
# Every release pull request changes __version__ in merge_guard/__init__.py.
# That file is in the release closure, so `checks` fails on the pull request
# until release-manifest.json is regenerated. Three jobs do it, and no person
# takes part. They run on every workflow run while a release pull request is
# open, because release-please rewrites (force-pushes) the branch whenever it
# updates the pull request:
#
# 1. `release-please` runs the action. Its `target` step then finds the open
#    release pull request. The action sets its `pr` output only in a run that
#    created or updated the pull request, and release-please rewrites the
#    branch in exactly that case. A run that finds the pull request unchanged
#    sets nothing, so a re-run after a failed push, and a manual dispatch,
#    would repair nothing. When `pr` is not set, `target` reads the open pull
#    requests instead. The job reports the release branch, or an empty name
#    when no release pull request is open.
# 2. `regenerate` checks out that branch and runs `scripts/release_manifest.py
#    write`. This is repository code, so the job references no secret and
#    stores no credential. It commits the result on a local copy to run `check`
#    on it, and it never pushes. It reports the head it read and the bytes of
#    the new manifest. When `write` changes nothing, it reports `changed=false`
#    and job 3 does not run, so a second run sends nothing.
# 3. `push` holds RELEASE_PLEASE_TOKEN and runs no file of its checkout. The two
#    values from job 2 are data from a job that ran repository code, so its
#    `commit` step refuses a head that is not the checked-out head, bytes that
#    are not base64 or are too long or are not a JSON object, and a manifest
#    path that is not a regular file. Then it commits release-manifest.json
#    alone, as the bot. Only its `push` step holds the token. That step sends
#    the commit as a plain push, never a forced one, so a release branch that
#    moved in the meantime rejects it and the workflow fails. Run it again.
#
# The jobs are separate because the steps of one job share one runner. A step can
# change the PATH, the environment and the git configuration that the later
# steps use, so a step that runs repository code could take a token that a later
# step holds. Each job has its own runner, and the personal access token never
# reaches job 2.
#
# This does not make job 2 harmless. Every job has the read-only job token, which
# reads nothing that this public repository does not already show. And job 3
# takes data from job 2. The most that data can do is change
# release-manifest.json on the release branch, and `checks` runs in full on that
# new head.
#
# The first `checks` run on a head that release-please has just written fails
# and names the stale file. The commit from job 3 replaces that head, and the
# run for it is the one that counts. If job 3 fails, run this workflow again:
# it regenerates only when the manifest is stale.
name: release-please

on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

# No grant by default. Each job asks for the one read it needs, and the personal
# access token makes every write.
permissions: {}

# Not the caller's group: reusing it with cancel-in-progress would cancel the
# workflow that called this one.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # `target` lists the open pull requests with the job token. The action
      # makes its own calls with the personal access token.
      pull-requests: read
    outputs:
      # The release branch, or an empty value when no release pull request is open.
      branch: ${{ steps.target.outputs.branch }}
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - id: target
        name: Find the open release pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # JSON of the pull request. Set only when the action created or
          # updated it in this run.
          REPORTED_PR: ${{ steps.release.outputs.pr }}
        run: |
          branch="$(jq -r 'select(.number >= 1) | .headBranchName // empty' <<<"${REPORTED_PR}")"
          if [ -z "${branch}" ]; then
            # No usable report: the pull request is unchanged, or none is open.
            # Read the 100 most recently updated open pull requests for it.
            branch="$(
              gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&sort=updated&direction=desc&per_page=100" |
                jq -r '
                  [.[]
                   | select(.head.repo.full_name == env.GITHUB_REPOSITORY)
                   | .head.ref
                   | select(startswith("release-please--branches--"))]
                  | if length > 1 then error("more than one open release pull request")
                    else (.[0] // "") end'
            )"
          fi
          pattern='^release-please--branches--[A-Za-z0-9._/-]+$'
          if [ -z "${branch}" ]; then
            echo "No open release pull request: nothing to regenerate."
          elif [[ "${branch}" =~ ${pattern} && "${branch}" != *..* ]]; then
            echo "Release branch: ${branch}"
          else
            echo "::error::The release branch name is not a release-please branch name."
            exit 1
          fi
          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"

  regenerate:
    # Runs repository code, so this job references no secret.
    needs: release-please
    if: needs.release-please.outputs.branch != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # The checkout of the release branch.
      contents: read
    outputs:
      # "true" only when `write` changed the manifest. The other two values are
      # set only then: the head that `write` read, and the new manifest as base64.
      changed: ${{ steps.regenerate.outputs.changed }}
      head: ${{ steps.regenerate.outputs.head }}
      manifest: ${{ steps.regenerate.outputs.manifest }}
    steps:
      - id: checkout
        name: Check out the release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.branch }}
          persist-credentials: false

      - id: regenerate
        name: Regenerate the release manifest
        shell: bash
        env:
          # For the local commit below, which is never pushed.
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
          GIT_COMMITTER_NAME: "github-actions[bot]"
          GIT_COMMITTER_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
        run: |
          release_head="$(git rev-parse HEAD)"
          python3 scripts/release_manifest.py write
          if git diff --quiet -- release-manifest.json; then
            echo "The release manifest already matches the release branch."
            echo "changed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          git --no-pager diff --stat -- release-manifest.json
          # `check` compares the manifest with the committed blobs, so it needs a
          # commit. This one stays on this runner. The next job makes its own.
          git commit --quiet -m "Check the regenerated manifest" -- release-manifest.json
          python3 scripts/release_manifest.py check
          manifest="$(git cat-file blob HEAD:release-manifest.json | base64 | tr -d '\n')"
          {
            echo "changed=true"
            echo "head=${release_head}"
            echo "manifest=${manifest}"
          } >> "${GITHUB_OUTPUT}"

  push:
    # Holds the personal access token, so this job runs no file of its checkout.
    needs: [release-please, regenerate]
    if: needs.regenerate.outputs.changed == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      # The checkout of the release branch. The personal access token makes the push.
      contents: read
    steps:
      - id: checkout
        name: Check out the release branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ needs.release-please.outputs.branch }}
          persist-credentials: false

      - id: commit
        name: Commit the regenerated manifest
        shell: bash
        env:
          # Data from the job that ran repository code: checked below, never run.
          REGENERATED_FROM: ${{ needs.regenerate.outputs.head }}
          MANIFEST: ${{ needs.regenerate.outputs.manifest }}
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
          GIT_COMMITTER_NAME: "github-actions[bot]"
          GIT_COMMITTER_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
        run: |
          hash_pattern='^[0-9a-f]{40}$'
          if [[ ! "${REGENERATED_FROM}" =~ ${hash_pattern} ]]; then
            echo "::error::The regenerate job did not report a full commit hash."
            exit 1
          fi
          if [ "$(git rev-parse HEAD)" != "${REGENERATED_FROM}" ]; then
            echo "::error::The release branch moved after the manifest was generated. Run this workflow again."
            exit 1
          fi
          base64_pattern='^[A-Za-z0-9+/]+={0,2}$'
          if [ "${#MANIFEST}" -gt 65536 ] || [[ ! "${MANIFEST}" =~ ${base64_pattern} ]]; then
            echo "::error::The regenerate job did not report a manifest in the expected form."
            exit 1
          fi
          decoded="$(mktemp)"
          if ! printf '%s' "${MANIFEST}" | base64 -d > "${decoded}"; then
            echo "::error::The reported manifest is not valid base64."
            exit 1
          fi
          if ! jq -e 'type == "object" and (.files | type == "object")' "${decoded}" > /dev/null; then
            echo "::error::The reported manifest is not a JSON object with a files object."
            exit 1
          fi
          # The bytes go to one path. Refuse it unless it is a regular file of the
          # commit: a link there would send them to another file.
          entry="$(git ls-tree HEAD -- release-manifest.json)"
          mode="${entry%% *}"
          if [ -L release-manifest.json ] || { [ "${mode}" != "100644" ] && [ "${mode}" != "100755" ]; }; then
            echo "::error::release-manifest.json is not a regular file of the release branch."
            exit 1
          fi
          cat "${decoded}" > release-manifest.json
          if git diff --quiet -- release-manifest.json; then
            echo "The release branch already carries this manifest: nothing to push."
            echo "committed=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          git --no-pager diff --stat -- release-manifest.json
          git -c core.hooksPath=/dev/null commit --quiet \
            -m "chore(release): regenerate the release manifest" \
            -m "release-please changed a file of the release closure, so the digests in release-manifest.json were stale. The release-please workflow regenerated them." \
            -- release-manifest.json
          echo "committed=true" >> "${GITHUB_OUTPUT}"

      - id: push
        name: Push the regenerated manifest
        if: steps.commit.outputs.committed == 'true'
        shell: bash
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          BRANCH: ${{ needs.release-please.outputs.branch }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          pattern='^release-please--branches--[A-Za-z0-9._/-]+$'
          if [[ ! "${BRANCH}" =~ ${pattern} || "${BRANCH}" == *..* ]]; then
            echo "::error::Refusing to push to a branch that is not a release-please branch."
            exit 1
          fi
          # Single quotes on purpose: the token expands when git runs the helper,
          # so it is in no command line and no git config file.
          # shellcheck disable=SC2016
          helper='!f() { echo username=x-access-token; echo "password=${RELEASE_PLEASE_TOKEN}"; }; f'
          # An empty value first drops every other helper. The key then limits
          # this one to the server of this repository.
          git -c core.hooksPath=/dev/null -c credential.helper= -c "credential.${GITHUB_SERVER_URL}.helper=${helper}" \
            push "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"
