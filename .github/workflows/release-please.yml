# Release automation under the repository's own merge policy: release-please
# opens one release pull request on a release-relevant conventional commit, and
# merging that pull request is the maintainer's release decision. The release
# pull request always changes a path outside the ordinary allowlist
# (pyproject.toml, merge_guard/__init__.py, this configuration or the
# manifest), so the gate never merges it.
#
# The merge workflow calls this one when its own run landed a pull request, so a
# sweep or a review pass that merges nothing costs no release run. `push` keeps
# the path for a merge performed with a token that does create push events, and
# `workflow_dispatch` is the manual reconciliation path. `workflow_run` is not a
# trigger here: it fires on every completion of the merge workflow, whether or
# not that run merged anything.
#
# The token is a fine-grained personal access token with Contents: write and
# Pull requests: write on this repository, stored as RELEASE_PLEASE_TOKEN. The
# default GITHUB_TOKEN cannot be used: a pull request it creates does not
# trigger the pull-request workflows, so the required checks would never run.
name: release-please

on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

# Not the caller's group: reusing it with cancel-in-progress would cancel the
# workflow that called this one.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json
