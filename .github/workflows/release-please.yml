# Release automation under the repository's own merge policy: release-please
# opens one release pull request on a release-relevant conventional commit, and
# merging that pull request is the maintainer's release decision. The release
# pull request always changes a path outside the ordinary allowlist
# (pyproject.toml, merge_guard/__init__.py, this configuration or the
# manifest), so the gate never merges it.
#
# The merge workflow calls this one when its own run landed a pull request, so a
# sweep or a review pass that merges nothing costs no release run. `push` keeps
# the path for a merge performed with a token that does create push events, and
# `workflow_dispatch` is the manual reconciliation path. `workflow_run` is not a
# trigger here: it fires on every completion of the merge workflow, whether or
# not that run merged anything.
#
# The token is a fine-grained personal access token with Contents: write and
# Pull requests: write on this repository, stored as RELEASE_PLEASE_TOKEN. The
# default GITHUB_TOKEN cannot be used: a pull request it creates, or a push it
# makes, starts no pull-request workflow, so `checks` would never run on the new
# head and the pull request could not merge.
#
# Every release pull request changes __version__ in merge_guard/__init__.py, a
# file of the release closure, so `checks` fails on it until release-manifest.json
# is regenerated. This one job does that on every run while a release pull
# request is open, because release-please force-pushes the branch whenever it
# updates the pull request:
#
# 1. `release` runs the action. `target` finds the open release pull request. The
#    action sets its `pr` output only in a run that created or updated it, so a
#    re-run after a failed push, and a manual dispatch, read the open pull
#    requests instead.
# 2. `commit` fetches that one branch and builds the regenerated manifest as one
#    commit on top of its head. The job checks out the default branch and nothing
#    else, so the only code that runs is code that review has seen. The release
#    branch is data: it is never checked out, `release_manifest.py write --commit`
#    reads its files through git, and git plumbing builds the commit. When the
#    manifest is already right it builds nothing.
# 3. `push` is the only step besides the action that holds RELEASE_PLEASE_TOKEN.
#    It sends the commit as a plain push, never a forced one, so a branch that
#    moved in the meantime rejects it. Run the workflow again.
#
# The steps of one job share one runner, so no step that reads what the release
# branch holds may hold the token. The checkout has no `ref`, so it is the ref
# that started the run: dispatch this workflow on the default branch. The fetch
# is anonymous because this repository is public. The first `checks` run on a
# head that release-please has just written fails and names the stale file; the
# run for the pushed commit is the one that counts.
name: release-please

on:
  push:
    branches: [main]
  workflow_call:
  workflow_dispatch:

# No grant by default. The job asks for the two reads it needs, and the personal
# access token makes every write.
permissions: {}

# Not the caller's group: reusing it with cancel-in-progress would cancel the
# workflow that called this one.
concurrency:
  group: release-please
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      # The checkout of the default branch, and the list of open pull requests
      # that `target` reads with the job token. The action makes its own calls
      # with the personal access token.
      contents: read
      pull-requests: read
    steps:
      - id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7  # v5.0.0
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      - id: target
        name: Find the open release pull request
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          # JSON of the pull request. Set only when the action created or
          # updated it in this run.
          REPORTED_PR: ${{ steps.release.outputs.pr }}
        run: |
          branch="$(jq -r 'select(.number >= 1) | .headBranchName // empty' <<<"${REPORTED_PR}")"
          if [ -z "${branch}" ]; then
            # No usable report: the pull request is unchanged, or none is open.
            # Read the 100 most recently updated open pull requests for it.
            branch="$(
              gh api "repos/${GITHUB_REPOSITORY}/pulls?state=open&sort=updated&direction=desc&per_page=100" |
                jq -r '
                  [.[]
                   | select(.head.repo.full_name == env.GITHUB_REPOSITORY)
                   | .head.ref
                   | select(startswith("release-please--branches--"))]
                  | if length > 1 then error("more than one open release pull request")
                    else (.[0] // "") end'
            )"
          fi
          pattern='^release-please--branches--[A-Za-z0-9._/-]+$'
          if [ -z "${branch}" ]; then
            echo "No open release pull request: nothing to regenerate."
          elif [[ "${branch}" =~ ${pattern} && "${branch}" != *..* ]]; then
            echo "Release branch: ${branch}"
          else
            echo "::error::The release branch name is not a release-please branch name."
            exit 1
          fi
          echo "branch=${branch}" >> "${GITHUB_OUTPUT}"

      # No `ref`, no `repository` and no stored credential: this is the only
      # checkout, and it is code that review has seen.
      - id: checkout
        name: Check out the default branch
        if: steps.target.outputs.branch != ''
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - id: commit
        name: Build the regenerated manifest commit
        if: steps.target.outputs.branch != ''
        shell: bash
        env:
          BRANCH: ${{ steps.target.outputs.branch }}
          GIT_TERMINAL_PROMPT: "0"
          GIT_AUTHOR_NAME: "github-actions[bot]"
          GIT_AUTHOR_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
          GIT_COMMITTER_NAME: "github-actions[bot]"
          GIT_COMMITTER_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
        run: |
          # The release branch is data. Fetch its head into the object store and
          # read it through git; nothing of it reaches the working tree.
          git fetch --quiet --no-tags --depth=1 "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "refs/heads/${BRANCH}"
          tip="$(git rev-parse --verify "FETCH_HEAD^{commit}")"
          blob="$(python3 scripts/release_manifest.py write --commit "${tip}" | git hash-object -w --no-filters --stdin)"
          if [ "${blob}" = "$(git rev-parse "${tip}:release-manifest.json")" ]; then
            echo "The release branch already carries the manifest it needs: nothing to push."
            exit 0
          fi
          # The tree is the fetched head's tree with one entry replaced, built in
          # a temporary index so the working tree and the real index stay as they are.
          mode="$(git ls-tree "${tip}" release-manifest.json | cut -d' ' -f1)"
          GIT_INDEX_FILE="${RUNNER_TEMP}/release-index"
          export GIT_INDEX_FILE
          git read-tree "${tip}"
          git update-index --cacheinfo "${mode},${blob},release-manifest.json"
          commit="$(git commit-tree "$(git write-tree)" -p "${tip}" \
            -m "chore(release): regenerate the release manifest" \
            -m "release-please changed a file of the release closure, so the digests in release-manifest.json were stale. The release-please workflow regenerated them.")"
          python3 scripts/release_manifest.py check --commit "${commit}"
          git --no-pager diff --stat "${tip}" "${commit}"
          echo "commit=${commit}" >> "${GITHUB_OUTPUT}"

      - id: push
        name: Push the regenerated manifest
        if: steps.commit.outputs.commit != ''
        shell: bash
        env:
          RELEASE_PLEASE_TOKEN: ${{ secrets.RELEASE_PLEASE_TOKEN }}
          BRANCH: ${{ steps.target.outputs.branch }}
          COMMIT: ${{ steps.commit.outputs.commit }}
          GIT_TERMINAL_PROMPT: "0"
        run: |
          # Single quotes on purpose: the token expands when git runs the helper,
          # so it is in no command line and no git config file.
          # shellcheck disable=SC2016
          helper='!f() { echo username=x-access-token; echo "password=${RELEASE_PLEASE_TOKEN}"; }; f'
          # An empty value first drops every other helper. The key then limits
          # this one to the server of this repository.
          git -c core.hooksPath=/dev/null -c credential.helper= -c "credential.${GITHUB_SERVER_URL}.helper=${helper}" \
            push "${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}.git" "${COMMIT}:refs/heads/${BRANCH}"
