# Replace before use: `CI` with your CI workflow's display name, and the
# merge-guard ref with the release SHA.
# .github/workflows/merge-guard-merge.yml — runs whenever the gate publishes.
name: merge-guard merge

on:
  workflow_run:
    workflows: ["checks", "merge-guard review"]
    types: [completed]
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: merge-guard-merge
  cancel-in-progress: false

jobs:
  merge:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - uses: mikomiel/merge-guard@65c985a7de7a7f699c5407eb4da30b7f8a198b3b  # v0.0.2: the temporal approval check
        with:
          mode: merge
          token: ${{ github.token }}
