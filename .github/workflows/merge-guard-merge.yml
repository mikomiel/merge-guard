# Replace before use: the merge-guard ref with the release SHA.
# .github/workflows/merge-guard-merge.yml — runs whenever the gate publishes.
#
# The review workflow is the only prerequisite trigger. It is itself triggered
# by CI and by the review relay, so a finished CI run and a review that arrives
# after CI both still lead to a merge attempt. Listing CI here as well evaluated
# every head twice, once before the gate had published (issue #23).
name: merge-guard merge

on:
  workflow_run:
    workflows: ["merge-guard review"]
    types: [completed]
  schedule:
    - cron: "17 * * * *"

permissions:
  contents: write
  pull-requests: write
  checks: read
  statuses: read

concurrency:
  group: merge-guard-merge
  cancel-in-progress: false

jobs:
  merge:
    # The only fact the release workflow needs. A merge that lands nothing leaves
    # it "false", so an hourly sweep or a review pass costs no release run.
    outputs:
      merged: ${{ steps.gate.outputs.merged }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      # The default-branch tree this workflow already checks out, not the released
      # tag: the `merged` output has to exist before the next release carries it.
      - id: gate
        uses: ./
        with:
          mode: merge
          token: ${{ github.token }}

  release:
    # A `workflow_run` trigger on this workflow fired on every completion, merged
    # or not, which cost one release run per sweep and per review pass.
    needs: merge
    if: needs.merge.outputs.merged == 'true'
    uses: ./.github/workflows/release-please.yml
    secrets: inherit
    permissions:
      contents: write
      pull-requests: write
