name: checks

on:
  push:
    branches: [main]
  pull_request:
  # A head can miss its required run, for example after a base merge (#14).
  # A dispatch starts `checks` on the branch, but not `dependency-review`,
  # which runs only on pull_request: this repository recovers with
  # close/reopen (docs/troubleshooting.md). A consumer whose required checks
  # all run under workflow_dispatch can use the dispatch instead.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The manifest check proves the commit the tag will point at, so the
          # checks run on the head, not on checkout's synthetic pull-request
          # merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          # The release-pin test resolves a tag, so the tags must be present.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Verify pinned Gitleaks and scan history, blobs and messages
        shell: bash
        run: |
          set -euo pipefail
          tools="$RUNNER_TEMP/merge-guard-tools"
          mkdir -p "$tools"
          curl --fail --location --silent --show-error --max-time 60 \
            --max-filesize 33554432 \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz \
            --output "$tools/gitleaks.tar.gz"
          printf '%s  %s\n' \
            '551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb' \
            "$tools/gitleaks.tar.gz" | sha256sum --check -
          tar --extract --gzip --file "$tools/gitleaks.tar.gz" \
            --directory "$tools" gitleaks
          "$tools/gitleaks" git --redact --no-banner --log-opts='--diff-merges=first-parent HEAD' .
          bash scripts/git_history_blobs.sh | "$tools/gitleaks" stdin --redact --no-banner
          git log HEAD --format=%B | "$tools/gitleaks" stdin --redact --no-banner
      - name: Scan tree, history and messages for private identifiers
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check_estate_identifiers.py
          bash scripts/git_history_blobs.sh | python3 scripts/check_estate_identifiers.py --stdin
          git log HEAD --format=%B | python3 scripts/check_estate_identifiers.py --stdin
      - name: Release manifest matches the tree
        run: python3 scripts/release_manifest.py check
      - name: Lint and test
        run: |
          python -m pip install --disable-pip-version-check -r requirements-dev.txt
          ruff check .
          if [ -d tests ]; then python -m pytest -q; fi

  dependency-review:
    name: dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/dependency-review-action@bbc44d14a204704ccc493733616cd1e93a0321ec # v5.0.1
        with:
          # No PR comment: the job keeps the read-only workflow token.
          comment-summary-in-pr: never
