name: forgejo

# The Forgejo adapter against a real Forgejo instance. The recorded cases in
# tests/fixtures/forge/ are synthetic; this job checks the adapter's requests
# and its reading of the responses against the real API. It needs nothing from
# outside the job: the instance is an ephemeral service container, and the job
# creates its accounts and data with a password made at run time.
#
# It is not a required context. tests/test_forgejo_workflow.py pins the image
# and the action references.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  forgejo-live:
    name: forgejo-live
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    services:
      forgejo:
        # Pinned by version and by digest; the digest decides. Change both
        # together.
        image: codeberg.org/forgejo/forgejo:17.0.1@sha256:fcd19ff4ebc85fb098a67e8e1d0d5a84d07dd6e8a23edcfdfd5b71a6178953be
        env:
          FORGEJO__security__INSTALL_LOCK: "true"
          FORGEJO__database__DB_TYPE: sqlite3
          FORGEJO__server__ROOT_URL: http://localhost:3000/
          # The adapter reads CI evidence from Forgejo Actions. Actions is on
          # by default; the job states it, because the tests need it.
          FORGEJO__actions__ENABLED: "true"
        ports:
          - 3000:3000
        options: >-
          --health-cmd "curl -fsS http://localhost:3000/api/v1/version"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: "3.12"
      - name: Install the test tools
        run: python -m pip install --disable-pip-version-check -r requirements-dev.txt
      - name: Run the Forgejo adapter against the instance
        env:
          FORGEJO_CONTAINER: ${{ job.services.forgejo.id }}
          MERGE_GUARD_FORGEJO_LIVE_URL: http://localhost:3000
          MERGE_GUARD_FORGEJO_LIVE_ADMIN: forge-admin
        run: |
          # The administrator password exists only in this step and in the
          # throwaway instance.
          MERGE_GUARD_FORGEJO_LIVE_PASSWORD="$(python3 -c 'import secrets; print(secrets.token_hex(24))')"
          echo "::add-mask::$MERGE_GUARD_FORGEJO_LIVE_PASSWORD"
          export MERGE_GUARD_FORGEJO_LIVE_PASSWORD
          docker exec --user git "$FORGEJO_CONTAINER" forgejo admin user create --admin \
            --username "$MERGE_GUARD_FORGEJO_LIVE_ADMIN" \
            --email "$MERGE_GUARD_FORGEJO_LIVE_ADMIN@example.com" \
            --password="$MERGE_GUARD_FORGEJO_LIVE_PASSWORD" \
            --must-change-password=false
          # The module skips only without MERGE_GUARD_FORGEJO_LIVE_URL, which
          # this step sets; -rs would name a skip.
          python -m pytest -q -rs tests/test_forgejo_live.py
