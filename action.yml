name: merge-guard
description: Publish the review status for a pull request head, or merge one eligible pull request.
inputs:
  mode:
    description: "review publishes the gate status; merge lands one eligible pull request."
    required: true
  policy:
    description: Path to the consumer policy file, relative to the repository root.
    required: false
    default: .github/merge-guard.toml
  token:
    description: Token used by `gh`. Defaults to the workflow token.
    required: false
    default: ""
outputs:
  merged:
    description: "'true' only when an applied merge run landed a pull request; otherwise 'false'."
    value: ${{ steps.envelope.outputs.merged }}
runs:
  using: composite
  steps:
    - name: Runtime for the engine (tomllib needs 3.11+)
      uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
      with:
        python-version: "3.12"
    - name: merge-guard ${{ inputs.mode }}
      id: guard
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.token || github.token }}
        # Inputs reach the script as data through the environment, never spliced into the shell source.
        # The action is the GitHub surface, so it names the forge itself: a policy written before the
        # forge key existed keeps working, and a policy that names another forge is refused.
        MERGE_GUARD_MODE: ${{ inputs.mode }}
        MERGE_GUARD_POLICY: ${{ inputs.policy }}
        MERGE_GUARD_ENVELOPE: ${{ runner.temp }}/merge-guard-envelope.json
      run: |
        set -o pipefail
        python3 "$GITHUB_ACTION_PATH/scripts/merge_guard.py" "$MERGE_GUARD_MODE" --apply --forge github --policy "$MERGE_GUARD_POLICY" \
          | tee "$MERGE_GUARD_ENVELOPE"
    # The envelope already says whether a merge landed. Deriving the output from it
    # adds no CLI flag and no second source of truth for the same fact.
    - name: Report whether this run merged a pull request
      id: envelope
      shell: bash
      env:
        MERGE_GUARD_ENVELOPE: ${{ runner.temp }}/merge-guard-envelope.json
      run: |
        python3 "$GITHUB_ACTION_PATH/scripts/merge_guard_envelope.py" "$MERGE_GUARD_ENVELOPE" "$GITHUB_OUTPUT"
