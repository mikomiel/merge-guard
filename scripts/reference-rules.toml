# The reference rule set for scripts/assurance.py.
#
# An example layout, not a policy to adopt: a synthetic monorepo with apps under
# apps/, service code under services/, shared scripts and configuration under
# shared/, a tool configuration under tools-config/ and host automation under
# infra/. It runs when no rule file is supplied, and it shows the format at a
# larger scale than examples/classifier-rules.toml. In v0.4.0 and every release
# before it, this file held the layout of the repository the classifier was
# extracted from. A repository that relied on that default supplies its own file
# (docs/classifier-rules.md).
#
# How a rule set is read: every rule is tested against every changed path, one
# matching path is enough to make the change C1, and the result lists the id of
# every rule that matched. The order of the rules in this file does not matter.

# The gate itself, its package (which holds the classifier) and its server and
# the service registry: the code that decides what may merge.
[[rule]]
id = "C1-GATE-AUTHORITY"
class = "C1"
exact = [
  "tools-config/scripts/gate_cli.py",
  "services/servers/gate_server.py",
  "services/registry.yaml",
]
prefixes = ["shared/scripts/gate/", "tools-config/scripts/gate/"]

# The repository authority file: which copy of a repository is authoritative,
# where it is written, mirrored and deployed, and what review and CI apply to
# it. The whole file is C1, not only those fields. Telling a comment edit from
# an authority change would need a field-level diff of the old and new YAML, and
# a wrong reading would not fail closed. Over-escalating only costs a stronger
# assurance route.
[[rule]]
id = "C1-REPOSITORY-AUTHORITY"
class = "C1"
exact = ["repos.yaml"]

# What CI trusts: the workflow directory the pull-request CI runs from, and the
# repository-owned CI entrypoint with the scripts that decide what it does. A
# change to any of them changes what CI trusts.
[[rule]]
id = "C1-CI-TRUST"
class = "C1"
prefixes = [".forgejo/workflows/"]
# Exact paths, not a scripts/ prefix: sibling scripts are ordinary repository
# code and keep the C2 default. Besides the entrypoint itself, the list holds
# what it sources (the environment every check runs under, the dependency
# refresh) and what decides how checks behave: the lease every test check goes
# through, whether a missing tool fails a check or skips it, and whether a push
# to main skips jobs that a pull request already ran.
exact = [
  "scripts/run-checks",
  "scripts/check-env",
  "scripts/check_lease.py",
  "scripts/refresh-deps.sh",
  "scripts/tool_policy.py",
  "scripts/job_reuse.py",
]

# Secrets, credential routing and permission policy: where credentials come from
# and what each agent is allowed to do.
[[rule]]
id = "C1-SECRETS-PERMISSIONS"
class = "C1"
exact = [
  "shared/config/secret-sources.yaml",
  "services/servers/secrets_bootstrap.py",
  ".claude/settings.json",
  "apps/web/settings.json",
]

# The servers that directly administer the network and hypervisor layer:
# firewall, ingress, egress, SSH trust, storage, backup and restore. The role
# code for the same hosts is covered by C1-AUTOMATION-RUNTIME below.
[[rule]]
id = "C1-NETWORK-HYPERVISOR"
class = "C1"
exact = ["services/servers/hypervisor_server.py"]
prefixes = ["services/servers/vm_"]

# The deployment and activation surface outside the gate package: what ships a
# change and what makes it take effect. Publication, review, merge and cleanup
# are already covered by the gate rule above.
[[rule]]
id = "C1-DEPLOY-ACTIVATE"
class = "C1"
exact = [
  "tools-config/scripts/deploy.py",
  "shared/scripts/deploy.py",
  "tools-config/scripts/deploy_config.py",
]
prefixes = [
  "shared/scripts/rollout/",
  "tools-config/scripts/rollout/",
]

# Host automation and the app role inputs it deploys, which set the runtime
# configuration of the hosts. Exempt: the automation's own tests, and Markdown
# documentation under any of these prefixes. The exemption is per path: one
# non-exempt path still makes the whole change C1.
[[rule]]
id = "C1-AUTOMATION-RUNTIME"
class = "C1"
prefixes = [
  "infra/",
  "apps/mobile/role/",
  "apps/api/role/",
  "apps/web/role/",
  "apps/worker/role/",
  "apps/admin/role/",
]
exempt_prefixes = ["infra/tests/"]
exempt_suffixes = [".md"]

# Documentation and policy text, where a broad test suite adds little confidence.
[doc_only]
suffixes = [".md"]
prefixes = [
  "docs/plans/",
  "tools-config/openspec/",
  "shared/openspec/",
  "services/openspec/",
  "infra/openspec/",
]

# No model-definition file or field is approved for C3, so both lists are empty
# and C3 never fires with this set. That is deliberate, not a placeholder: with
# no approved file the first of C3's five conditions can never hold, as the
# module docstring of assurance.py explains.
[model_definition]
files = []
fields = []
